<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      :root {
        --aurora-ink: #1B1714;
        --aurora-brass: #B88A3E;
        --aurora-brass-dim: #7A5C2A;
        --aurora-paper: #E9DFC8;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: var(--aurora-ink);
        overflow: hidden;
      }

      #unity-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        background: var(--aurora-ink);
        display: block;
      }

      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(60vw, 420px);
        font-family: Georgia, 'EB Garamond', serif;
        color: var(--aurora-paper);
        text-align: center;
      }

      #unity-logo {
        font-size: 1.4rem;
        letter-spacing: 0.08em;
        margin-bottom: 1rem;
      }

      #unity-progress-bar-track {
        height: 4px;
        background: var(--aurora-brass-dim);
      }

      #unity-progress-bar-fill {
        height: 100%;
        width: 0%;
        background: var(--aurora-brass);
        transition: width 0.15s ease-out;
      }

      #unity-fullscreen-button {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        padding: 0.4rem 0.8rem;
        background: var(--aurora-ink);
        color: var(--aurora-paper);
        border: 1px solid var(--aurora-brass-dim);
        cursor: pointer;
        font-family: Georgia, serif;
      }

      #unity-fullscreen-button:hover {
        border-color: var(--aurora-brass);
      }

      #unity-webgl2-warning {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        color: var(--aurora-paper);
        background: var(--aurora-ink);
        font-family: Georgia, serif;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-progress-bar-track">
          <div id="unity-progress-bar-fill"></div>
        </div>
      </div>
      <button id="unity-fullscreen-button" title="Fullscreen">⛶</button>
      <div id="unity-webgl2-warning">
        O seu navegador não suporta WebGL2. Experimente uma versão recente do Chrome, Firefox ou Edge.<br>
        Your browser does not support WebGL2. Please try a recent version of Chrome, Firefox or Edge.
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFill = document.querySelector("#unity-progress-bar-fill");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warning = document.querySelector("#unity-webgl2-warning");

      var canvasEl = document.createElement("canvas");
      var hasWebGL2 = !!(canvasEl.getContext && canvasEl.getContext("webgl2"));

      if (!hasWebGL2) {
        warning.style.display = "flex";
        loadingBar.style.display = "none";
        fullscreenButton.style.display = "none";
      } else {
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        var config = {
          dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
          frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
          codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
          memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        };

        // The canvas requests focus on the first click, as required to accept keyboard/gamepad
        // input in the browser (codespec.md §6) — never relies on Escape, which browsers use to
        // leave fullscreen.
        canvas.addEventListener("click", function () {
          canvas.focus();
        });

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            progressBarFill.style.width = (100 * progress) + "%";
          }).then(function (unityInstance) {
            loadingBar.style.display = "none";
            canvas.focus();

            fullscreenButton.addEventListener("click", function () {
              unityInstance.SetFullscreen(1);
            });
          }).catch(function (message) {
            alert(message);
          });
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
